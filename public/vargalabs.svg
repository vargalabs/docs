<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Rounded Dark Teal Background -->
  <rect width="500" height="500" rx="28" ry="28" fill="#032B35" />

  <!-- "Varga" Bottom Wordmark -->
  <text x="245" y="452"
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="112"
        font-weight="600"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2">Varga</text>

  <!-- "LABS" Vertical Right Wordmark (reads bottom-to-top) -->
  <text x="415" y="205"
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="86"
        font-weight="700"
        fill="#395B64"
        text-anchor="middle"
        letter-spacing="5"
        transform="rotate(-90 415 205)">LABS</text>

  <!-- Tilted Erlenmeyer Flask Group -->
  <g transform="rotate(-7 185 215)">
    
    <!-- Orange Liquid inside the Beaker -->
    <path d="M 103 207
             C 138 205, 165 212, 195 190
             C 228 166, 260 156, 282 182
             L 304 260
             C 314 295, 296 315, 256 315
             L 104 315
             C 64 315, 46 295, 58 262
             Z"
          fill="#DF5A00" />

    <!-- Subtle Dark Orange Rim Highlight at Bottom-Left of Liquid -->
    <path d="M 68 258 C 72 276, 84 288, 100 294"
          fill="none"
          stroke="#9E3800"
          stroke-width="6"
          stroke-linecap="round" />

    <!-- Bubbles Inside Liquid -->
    <circle cx="174" cy="264" r="4.5" fill="#F6B352" />
    <circle cx="192" cy="256" r="5" fill="#F6B352" />
    <circle cx="203" cy="272" r="5.5" fill="#F6B352" />

    <!-- "Julia" inside the Orange Liquid -->
    <text x="255" y="250"
          font-family="'Courier New', monospace, sans-serif"
          font-size="22"
          font-weight="bold"
          fill="#4A1C00"
          text-anchor="middle"
          transform="rotate(-55 255 250)">Julia</text>

    <!-- Escaping Bubbles & Language Names (in neck & above flask) -->
    <!-- Small light bubbles inside flask neck -->
    <circle cx="135" cy="175" r="4" fill="#E8E2A6" />
    <circle cx="150" cy="192" r="4.5" fill="#E8E2A6" />
    <circle cx="204" cy="156" r="5" fill="#E8E2A6" />
    <circle cx="200" cy="112" r="4" fill="#E8E2A6" />

    <!-- Medium yellow bubble with tiny droplet highlight -->
    <circle cx="182" cy="145" r="12" fill="#E6B800" />
    <circle cx="193" cy="156" r="3.5" fill="#FDF6C7" />

    <!-- Large gold bubble near top of neck -->
    <circle cx="252" cy="94" r="16" fill="#C9A206" />

    <!-- High escaping bubbles -->
    <circle cx="235" cy="54" r="4.5" fill="#E8E2A6" />
    <circle cx="250" cy="26" r="4.5" fill="#E8E2A6" />
    <circle cx="316" cy="26" r="6" fill="#B6950B" />

    <!-- Programming Languages Brewing Out -->
    <text x="172" y="116"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="14"
          font-weight="bold"
          fill="#CBE4DE"
          transform="rotate(-42 172 116)">python</text>

    <text x="242" y="60"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="16"
          font-weight="bold"
          fill="#CBE4DE"
          transform="rotate(-12 242 60)">C++</text>

    <text x="195" y="34"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#87A8A4"
          transform="rotate(48 195 34)">SQL</text>

    <text x="285" y="18"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="14"
          font-weight="bold"
          fill="#6E8E8A"
          transform="rotate(-20 285 18)">R</text>

    <!-- White Beaker / Flask Outline (Open Top with Rolled Lip Flanges) -->
    <path d="M 134 52
             L 150 52
             L 150 112
             L 45 262
             C 24 298, 48 330, 96 330
             L 264 330
             C 312 330, 336 298, 315 262
             L 255 112
             L 255 62
             L 271 62"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Left and Right Thickened Flask Rim Caps -->
    <rect x="122" y="42" width="32" height="22" rx="6" fill="#FFFFFF" />
    <rect x="251" y="52" width="32" height="22" rx="6" fill="#FFFFFF" />
  </g>
</svg>
