<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Solarized base03 Background -->
  <rect width="500" height="500" rx="28" ry="28" fill="#002b36" />

  <!-- "SIGMA" Bottom Wordmark (base3) -->
  <text x="245" y="452"
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="108"
        font-weight="600"
        fill="#fdf6e3"
        text-anchor="middle"
        letter-spacing="4">SIGMA</text>

  <!-- "IAM" Vertical Right Wordmark (base01) -->
  <text x="418" y="205"
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="102"
        font-weight="700"
        fill="#586e75"
        text-anchor="middle"
        letter-spacing="8"
        transform="rotate(-90 418 205)">IAM</text>

  <!-- Tilted Shackle-Flask Group -->
  <g transform="rotate(-6 185 215)">

    <!-- Padlock Shackle Arch (base01) -->
    <path d="M 148 110
             L 148 64
             C 148 16, 256 16, 256 64
             L 256 88"
          fill="none"
          stroke="#586e75"
          stroke-width="14"
          stroke-linecap="round" />

    <!-- Solarized Orange Liquid (#cb4b16) -->
    <path d="M 103 207
             C 138 205, 165 212, 195 190
             C 228 166, 260 156, 282 182
             L 304 260
             C 314 295, 296 315, 256 315
             L 104 315
             C 64 315, 46 295, 58 262
             Z"
          fill="#cb4b16" />

    <!-- Rim Highlight (base02) -->
    <path d="M 68 258 C 72 276, 84 288, 100 294"
          fill="none"
          stroke="#073642"
          stroke-width="6"
          stroke-linecap="round" />

    <!-- Centered Keyhole Inside Liquid (base03) -->
    <circle cx="195" cy="248" r="16" fill="#002b36" />
    <path d="M 186 259 L 179 296 L 211 296 L 204 259 Z" fill="#002b36" />

    <!-- Bubbles Inside Liquid (Solarized yellow & base2) -->
    <circle cx="132" cy="262" r="5.5" fill="#b58900" />
    <circle cx="148" cy="278" r="4.5" fill="#eee8d5" />
    <circle cx="248" cy="246" r="6" fill="#b58900" />
    <circle cx="262" cy="268" r="4.5" fill="#eee8d5" />

    <!-- Escaping Bubbles & Claims -->
    <circle cx="182" cy="148" r="12" fill="#b58900" />
    <circle cx="242" cy="102" r="15" fill="#b58900" />
    <circle cx="152" cy="182" r="4.5" fill="#eee8d5" />
    <circle cx="206" cy="160" r="5" fill="#eee8d5" />
    <circle cx="202" cy="64" r="4.5" fill="#eee8d5" />

    <text x="168" y="120"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#eee8d5"
          transform="rotate(-38 168 120)">OpenID</text>

    <text x="218" y="76"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#93a1a1"
          transform="rotate(-12 218 76)">OAuth</text>

    <text x="184" y="48"
          font-family="'Montserrat', 'Arial', sans-serif"
          font-size="14"
          font-weight="bold"
          fill="#2aa198"
          transform="rotate(25 184 48)">JWT</text>

    <!-- Flask Body Outline (base3) -->
    <path d="M 134 92
             L 150 92
             L 150 112
             L 45 262
             C 24 298, 48 330, 96 330
             L 264 330
             C 312 330, 336 298, 315 262
             L 255 112
             L 255 98
             L 271 98"
          fill="none"
          stroke="#fdf6e3"
          stroke-width="15"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Left and Right Rim Caps (base3) -->
    <rect x="122" y="82" width="32" height="22" rx="6" fill="#fdf6e3" />
    <rect x="251" y="88" width="32" height="22" rx="6" fill="#fdf6e3" />
  </g>
</svg>
